
name: Build Ahfaz APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x Ahfaz_Android_Starter/gradlew || true

      - name: Build debug APK
        working-directory: Ahfaz_Android_Starter
        run: gradle --version && gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ahfaz-APK
          path: Ahfaz_Android_Starter/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
